name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

# Quran text: data/quran/*.txt is not in the repository (only checksums.txt is). The jobs below
# download it from Tanzil only when the repository owner has accepted the Tanzil Terms of Use
# (https://tanzil.net/docs/Text_License) by setting the Actions variable TANZIL_TERMS_ACCEPTED=true
# (Settings > Secrets and variables > Actions > Variables). The download must match the committed
# checksums or the job fails. Without the variable, tests that need the text are skipped.

jobs:
  format-lint:
    name: format + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Install pinned dev tools
        run: pip install -r tools/requirements-dev.txt
      - name: Python format (ruff format)
        run: ruff format --check tools
      - name: Python lint (ruff check)
        run: ruff check tools
      - name: C++ format (clang-format)
        run: git ls-files '*.h' '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror

  python-tests:
    name: python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install test dependencies
        run: pip install -r tools/requirements.txt
      - name: Restore Quran text cache
        id: quran-cache
        uses: actions/cache@v6
        with:
          path: |
            data/quran/quran-uthmani.txt
            data/quran/quran-simple-clean.txt
          key: quran-text-${{ hashFiles('data/quran/checksums.txt') }}
      - name: Download Quran text (only if the owner accepted the Tanzil terms)
        if: steps.quran-cache.outputs.cache-hit != 'true' && vars.TANZIL_TERMS_ACCEPTED == 'true'
        run: python -I tools/quran_text/download.py --agree-tanzil-terms
      - name: Check that the committed checksums were not changed
        run: git diff --exit-code data/quran/checksums.txt
      - name: Note when Quran-text tests are skipped
        if: hashFiles('data/quran/quran-uthmani.txt') == ''
        run: echo "::warning::Quran text not available (set the TANZIL_TERMS_ACCEPTED Actions variable); tests that need it are skipped"
      - name: pytest
        run: python -m pytest -q

  build-test:
    name: build + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            flags: "-DMUTQIN_WERROR=ON"
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release
            flags: "-DMUTQIN_WERROR=ON"
          - name: linux-asan-ubsan
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            flags: >-
              -DMUTQIN_WERROR=ON
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          - name: macos
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
            flags: "-DMUTQIN_WERROR=ON"
          - name: windows-msvc
            os: windows-latest
            build_type: Release
            flags: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install Python dependencies of the parity tests
        run: pip install -r tools/requirements.txt
      - name: Restore Quran text cache
        id: quran-cache
        uses: actions/cache@v6
        with:
          path: |
            data/quran/quran-uthmani.txt
            data/quran/quran-simple-clean.txt
          key: quran-text-${{ hashFiles('data/quran/checksums.txt') }}
      - name: Download Quran text (only if the owner accepted the Tanzil terms)
        if: steps.quran-cache.outputs.cache-hit != 'true' && vars.TANZIL_TERMS_ACCEPTED == 'true'
        run: python -I tools/quran_text/download.py --agree-tanzil-terms
      - name: Check that the committed checksums were not changed
        run: git diff --exit-code data/quran/checksums.txt
      - name: Note when Quran-text tests are skipped
        if: hashFiles('data/quran/quran-uthmani.txt') == ''
        run: echo "::warning::Quran text not available (set the TANZIL_TERMS_ACCEPTED Actions variable); parity and loader tests are skipped"
      - name: Configure
        run: |
          if [ -n "${{ matrix.cc }}" ]; then export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --parallel 4

  sherpa-backend:
    name: sherpa-onnx backend (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHERPA_VERSION: v1.13.8
      SHERPA_ARCHIVE: sherpa-onnx-v1.13.8-linux-x64-shared-no-tts.tar.bz2
      SHERPA_SHA256: d0f96c8b65c6cd0974fada22737e337de81bc8cd2abbec2e39caf358b1eec5fc
      MODEL_ARCHIVE: sherpa-onnx-streaming-zipformer-ctc-multi-zh-hans-int8-2023-12-13.tar.bz2
      MODEL_SHA256: c7ff82aefd36244d1f17a410cc334b271e1742779ce58246c7ac0e3fef5b2a1f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install Python dependencies of the parity tests
        run: pip install -r tools/requirements.txt
      - name: Restore Quran text cache
        id: quran-cache
        uses: actions/cache@v6
        with:
          path: |
            data/quran/quran-uthmani.txt
            data/quran/quran-simple-clean.txt
          key: quran-text-${{ hashFiles('data/quran/checksums.txt') }}
      - name: Download Quran text (only if the owner accepted the Tanzil terms)
        if: steps.quran-cache.outputs.cache-hit != 'true' && vars.TANZIL_TERMS_ACCEPTED == 'true'
        run: python -I tools/quran_text/download.py --agree-tanzil-terms
      - name: Restore sherpa-onnx and test model cache
        id: sherpa-cache
        uses: actions/cache@v6
        with:
          path: ~/sherpa
          key: sherpa-${{ env.SHERPA_SHA256 }}-${{ env.MODEL_SHA256 }}
      - name: Download sherpa-onnx (Apache-2.0) and a public streaming test model, verify checksums
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/sherpa/dl ~/sherpa/lib ~/sherpa/model
          cd ~/sherpa/dl
          curl -sfL -O "https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_VERSION}/${SHERPA_ARCHIVE}"
          curl -sfL -O "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${MODEL_ARCHIVE}"
          echo "${SHERPA_SHA256}  ${SHERPA_ARCHIVE}" | sha256sum -c -
          echo "${MODEL_SHA256}  ${MODEL_ARCHIVE}" | sha256sum -c -
          tar xjf "${SHERPA_ARCHIVE}" -C ~/sherpa/lib
          tar xjf "${MODEL_ARCHIVE}" -C ~/sherpa/model
          rm -f ~/sherpa/dl/*.tar.bz2
      - name: Configure (backend on)
        run: |
          SHERPA_DIR=$(ls -d ~/sherpa/lib/sherpa-onnx-*)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMUTQIN_WERROR=ON \
            -DMUTQIN_WITH_SHERPA=ON -DSHERPA_ONNX_DIR="$SHERPA_DIR" -DMUTQIN_CLI_MIC=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test the backend with a real streaming CTC model
        run: |
          MODEL_DIR=$(ls -d ~/sherpa/model/sherpa-onnx-*)
          export MUTQIN_SHERPA_TEST_MODEL_DIR="$MODEL_DIR"
          export MUTQIN_SHERPA_TEST_WAV="$MODEL_DIR/test_wavs/DEV_T0000000000.wav"
          if [ ! -f data/quran/quran-uthmani.txt ]; then
            echo "::warning::Quran text not available (set TANZIL_TERMS_ACCEPTED); the sherpa test is skipped"
          fi
          ctest --test-dir build --output-on-failure -R Sherpa

  android:
    name: android app (ktlint, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true
      - name: Kotlin format (ktlint, MIT)
        run: |
          android/scripts/fetch_ktlint.sh
          cd android && .tools/ktlint
      - name: Android SDK components (platform, NDK, CMake)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - name: sherpa-onnx Android libraries (checksum-verified)
        run: android/scripts/fetch_sherpa.sh
      - name: Restore Quran text cache
        id: quran-cache
        uses: actions/cache@v6
        with:
          path: |
            data/quran/quran-uthmani.txt
            data/quran/quran-simple-clean.txt
          key: quran-text-${{ hashFiles('data/quran/checksums.txt') }}
      - name: Download Quran text (only if the owner accepted the Tanzil terms)
        if: steps.quran-cache.outputs.cache-hit != 'true' && vars.TANZIL_TERMS_ACCEPTED == 'true'
        run: python3 -I tools/quran_text/download.py --agree-tanzil-terms
      - name: Choose whether the app gets the Quran text
        run: |
          if [ -f data/quran/quran-uthmani.txt ]; then
            echo "GRADLE_FLAGS=" >> "$GITHUB_ENV"
          else
            echo "::warning::Quran text not available (set the TANZIL_TERMS_ACCEPTED Actions variable); the app is built without it"
            echo "GRADLE_FLAGS=-PnoQuranAssets" >> "$GITHUB_ENV"
          fi
      - name: Android lint
        run: cd android && ./gradlew --no-daemon $GRADLE_FLAGS :app:lintDebug
      - name: Build debug and release (R8) apps
        run: cd android && ./gradlew --no-daemon $GRADLE_FLAGS :app:assembleDebug :app:assembleRelease
      # The APKs are deliberately not uploaded: they contain the Tanzil text, which is not ours to redistribute.
