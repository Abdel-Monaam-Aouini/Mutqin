# Dependabot: weekly update pull requests, one grouped PR per ecosystem.
#
# Not covered here (Dependabot cannot track them): GoogleTest (CMake FetchContent URL), miniaudio (CMake
# download) and sherpa-onnx + its test model (CI download). Those are pinned by URL and SHA-256; the
# weekly workflow cpp-deps.yml opens one issue when a newer release exists, and you update them by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    groups:
      python:
        patterns: ["*"]
